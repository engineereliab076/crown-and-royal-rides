name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  db-integration:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Clearly fake, CI-only local credentials. Not a real secret. The database
    # name contains "test" so the destructive-safety gate accepts it.
    env:
      TEST_DATABASE_URL: postgresql://crr_ci:crr_ci_local@localhost:5432/crown_and_royal_rides_test?schema=public
      TEST_DIRECT_DATABASE_URL: postgresql://crr_ci:crr_ci_local@localhost:5432/crown_and_royal_rides_test?schema=public
      ALLOW_TEST_DATABASE_DESTRUCTIVE_OPERATIONS: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crr_ci
          POSTGRES_PASSWORD: crr_ci_local
          POSTGRES_DB: crown_and_royal_rides_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crr_ci -d crown_and_royal_rides_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Database integration tests (migration deploy + constraints)
        run: pnpm test:integration

      - name: Verify migration drift
        env:
          SHADOW_DATABASE_URL: postgresql://crr_ci:crr_ci_local@localhost:5432/crown_and_royal_rides_test?schema=public
        run: pnpm db:migrate:verify

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Build
        run: pnpm build

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
